<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý giá | Khải Thịnh</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Be Vietnam Pro", system-ui, Arial, sans-serif; background: #eef4f0; color: #13251e; }
  img { -webkit-user-drag: none; }

  /* ===== Header nền xanh dương đậm — logo nổi bật ===== */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: linear-gradient(90deg, #14304e 0%, #1b4d86 100%);
    border-bottom: 3px solid #f0c049;
    box-shadow: 0 2px 12px rgba(9,26,46,.35);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar .brand-logo { height: 64px; width: auto; background: #fff; padding: 6px 8px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.32); }
  .topbar h1 { font-size: 18px; font-weight: 800; letter-spacing: .5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .topbar .sub { font-size: 12px; color: #cfe0f5; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .topbar .logout { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .topbar .logout:hover { background: rgba(255,255,255,.14); }
  .topbar .hist-btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; font-weight: 600; }
  .topbar .hist-btn:hover { background: rgba(255,255,255,.14); border-color: #f0c049; }
  .topbar .save-all { background: linear-gradient(135deg, #f0c049, #d9771a); color: #fff; border: none; padding: 10px 18px; border-radius: 9px; font-weight: 800; cursor: pointer; font-size: 13px; white-space: nowrap; box-shadow: 0 3px 8px rgba(217,119,26,.45); }
  .topbar .save-all:hover { filter: brightness(1.06); }
  .topbar .save-all:disabled { background: #b8c4bd; box-shadow: none; cursor: not-allowed; filter: none; }
  .topbar .save-all.has-pending { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,128,32,.55); } 50% { box-shadow: 0 0 0 9px rgba(224,128,32,0); } }

  .toolbar { max-width: 1100px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 240px; padding: 12px 16px; border: 1px solid #cfdbd4; border-radius: 10px; font-size: 14px; background: #fff; box-shadow: 0 1px 3px rgba(11,51,39,.05); }
  .toolbar input[type=search]:focus { outline: 2px solid #b7dfc9; border-color: #10b981; }
  .toolbar .status { font-size: 13px; color: #0b6b3f; font-weight: 700; white-space: nowrap; }

  .summary { max-width: 1100px; margin: 14px auto 0; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stat { background: #fff; border: 1px solid #e2ece5; border-radius: 18px; padding: 6px 14px; font-size: 12.5px; color: #40564c; box-shadow: 0 1px 3px rgba(11,51,39,.05); }
  .stat b { color: #0b3b2b; }
  .stat.warn { background: #fff4e5; border-color: #f0c98a; color: #9a5b0e; font-weight: 700; }

  .wrap { max-width: 1100px; margin: 16px auto 44px; padding: 0 16px; }
  .group-block { margin-bottom: 20px; background: #fff; border: 1px solid #e2ece5; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(11,51,39,.07); }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #14304e, #1b4d86); color: #fff; }
  .group-num { background: linear-gradient(135deg, #f0c049, #d9771a); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 11px; border-radius: 10px; box-shadow: 0 2px 5px rgba(217,119,26,.35); }
  .group-title { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
  .group-count { margin-left: auto; font-size: 12px; color: #d3e8dd; white-space: nowrap; background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 12px; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #eef2ef; font-size: 13.5px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  th { background: #f0f6f3; color: #0b3b2b; font-weight: 700; white-space: nowrap; }
  th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { text-align: center; }
  tbody tr:hover td { background: #fafdfb; }
  .save-btn, .hide-btn { width: 60px; display: inline-block; }
  .prod-thumb { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid #e2e8e4; }
  .prod-name { font-weight: 600; color: #0b3327; }
  .prod-en { font-size: 12px; color: #7a8a82; }
  .prod-meta { font-size: 12px; color: #55685f; margin-top: 2px; }
  .rename-btn { background: none; border: 1px solid #cdd9d2; border-radius: 6px; color: #0b3b2b; cursor: pointer; padding: 4px 8px; font-size: 13px; margin-top: 6px; }
  .rename-btn:hover { background: #eef5f1; border-color: #10b981; }
  .rename-form { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .rename-form input { padding: 7px 9px; border: 1px solid #cdd9d2; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; }
  .rename-row { display: flex; gap: 6px; align-items: center; }
  .rename-row button { padding: 7px 12px; border-radius: 6px; font-weight: 700; font-size: 12.5px; cursor: pointer; border: none; }
  .rename-save { background: #10b981; color: #fff; }
  .rename-save:hover { background: #0da06f; }
  .rename-cancel { background: #eef1ef; color: #33443c; }
  .rename-cancel:hover { background: #dfe6e2; }
  .price-input { width: 110px; padding: 8px 10px; border: 1px solid #cdd9d2; border-radius: 8px; font-size: 14px; text-align: right; }
  .price-input.changed { border-color: #e08020; background: #fff7ec; }
  .price-def { font-size: 12px; color: #88968e; display:block; margin-top:2px; }
  .save-btn { background: #10b981; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .save-btn:hover { background: #0da06f; }
  .save-btn:disabled { background: #b8c4bd; cursor: not-allowed; }
  .save-btn.staged { box-shadow: inset 0 0 0 2px #e08020; background: #10b981; }
  .save-btn.pending { box-shadow: inset 0 0 0 2px #e08020; background: #10b981; }
  .save-btn.pending:hover { background: #0da06f; }
  .hide-btn.staged { box-shadow: inset 0 0 0 2px #e08020; }
  .hide-btn { background: #e74c3c; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .hide-btn:hover { background: #c0392b; }
  .hide-btn.hidden { background: #10b981; }
  .hide-btn.hidden:hover { background: #0da06f; }
  .row-hidden td { opacity: .55; }
  .hid-badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#fdecea; color:#c0392b; font-weight:700; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#eef5f1; color:#0b6b3f; }
  .msg { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #13251e; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; z-index: 60; opacity: 0; transition: opacity .25s; box-shadow: 0 6px 16px rgba(0,0,0,.22); }
  .msg.show { opacity: 1; }
  .login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #14304e, #1b4d86 50%, #0e3a6b); display: flex; align-items: center; justify-content: center; z-index: 70; }
  .login-box { background: #fff; padding: 34px 32px; border-radius: 16px; width: 340px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .login-box .brand-logo { height: 56px; width: auto; margin-bottom: 12px; }
  .login-box h2 { font-size: 17px; color: #0b3327; margin-bottom: 16px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #cdd9d2; border-radius: 9px; font-size: 15px; margin-bottom: 14px; }
  .login-box input:focus { outline: 2px solid #b7dfc9; border-color: #10b981; }
  .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0b3b2b, #15614a); color: #fff; border: none; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 15px; }
  .login-box button:hover { filter: brightness(1.08); }
  .login-box .err { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .count { font-size: 12px; color: #7a8a82; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(11,26,21,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 520px; max-width: 94vw; max-height: 84vh; overflow: auto; padding: 24px; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size: 16px; color: #0b3327; margin-bottom: 12px; }
  .modal textarea { width: 100%; padding: 11px 14px; border: 1px solid #cdd9d2; border-radius: 8px; font-size: 14px; min-height: 74px; resize: vertical; box-sizing: border-box; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .modal-actions button { padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; border: none; }
  .modal-actions .ok { background: #e08020; color: #fff; }
  .modal-actions .ok:hover { background: #c96f17; }
  .modal-actions .cancel { background: #eef1ef; color: #33443c; }
  .modal-actions .cancel:hover { background: #dfe6e2; }
  .hist-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #eef2ef; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .h-time { font-size: 12px; color: #7a8a82; min-width: 148px; }
  .hist-item .h-desc { flex: 1; font-size: 13.5px; color: #13251e; }
  .hist-item .h-chips { white-space: nowrap; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; color: #7a8a82; }
  .hist-restore { background: #10b981; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .hist-restore:hover { background: #0da06f; }
  .hist-empty { color: #7a8a82; font-size: 13px; padding: 12px 0; }
  .pending-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: transparent; margin-right: 6px; }
  .pending-dot.on { background: #e08020; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <img src="assets/logo.png" alt="Khải Thịnh" class="brand-logo">
    <h2>Quản lý giá sản phẩm</h2>
    <input type="password" id="pwd" placeholder="Mật khẩu quản trị" autocomplete="current-password">
    <button id="loginBtn">Đăng nhập</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <img src="assets/logo.png" alt="Khải Thịnh" class="brand-logo">
      <div>
        <h1>Quản lý giá sản phẩm</h1>
        <div class="sub">Công ty TNHH TM DV Khải Thịnh · Catalogue 2026</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="hist-btn" id="histBtn">Lịch sử</button>
      <button class="save-all" id="saveAllBtn">Lưu tất cả thay đổi</button>
      <button class="logout" id="logoutBtn">Thoát</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Tìm sản phẩm...">
  </div>

  <div class="summary" id="summary"></div>

  <div class="wrap" id="groups">
  </div>
</div>

<div class="modal-overlay" id="descModal">
  <div class="modal">
    <h3>Lưu tất cả thay đổi</h3>
    <div class="count" id="descSummary"></div>
    <textarea id="descInput" placeholder="Nhập mô tả thay đổi (bắt buộc)…"></textarea>
    <div class="modal-actions">
      <button class="cancel" id="descCancel">Hủy</button>
      <button class="ok" id="descOk">Lưu thay đổi</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="histModal">
  <div class="modal">
    <h3>Lịch sử thay đổi</h3>
    <div id="histList"></div>
    <div class="modal-actions">
      <button class="cancel" id="histClose">Đóng</button>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>

<script>
(function(){
  "use strict";
  var PWD_KEY = "kt-admin-pwd";
  var overrides = {};       // src -> price (saved)
  var names = {};           // src -> {vi, en} (saved)
  var hidden = [];          // srcs of hidden products (saved)
  var products = [];         // from products.json
  var dirty = {};            // src -> price (staged edits)
  var dirtyHidden = {};      // src -> bool (staged hide state, only entries staged)
  var dirtyNames = {};       // src -> {vi,en} (staged name edits)
  var versions = [];         // [{id, at, desc, snapshot}]
  var sortKey = "src";

  function $(id){ return document.getElementById(id); }

  function showMsg(t){
    var m = $("msg"); m.textContent = t; m.classList.add("show");
    clearTimeout(m._t); m._t = setTimeout(function(){ m.classList.remove("show"); }, 2200);
  }

  function money(v){ return (v==null || v===0) ? "—" : v.toLocaleString("vi-VN") + " ₫"; }

  function render(){
    var q = $("search").value.trim().toLowerCase();
    var box = $("groups");
    box.innerHTML = "";
    // products already in catalogue order; group by group_num (in order)
    var gmap = {};
    var order = [];
    products.forEach(function(p){
      if (!(p.group_num in gmap)){
        gmap[p.group_num] = { num: p.group_num, title: p.group_title, items: [] };
        order.push(p.group_num);
      }
      gmap[p.group_num].items.push(p);
    });
    order.forEach(function(gn, i){
      var g = gmap[gn];
      var shown = g.items.filter(function(p){
        if (!q) return true;
        var nv = stagedName(p.src).vi;
        var ne = stagedName(p.src).en;
        return nv.toLowerCase().indexOf(q) >= 0 || ne.toLowerCase().indexOf(q) >= 0 || p.brand.toLowerCase().indexOf(q) >= 0;
      });
      if (!shown.length) return;
      var head = document.createElement("div");
      head.className = "group-head";
      head.innerHTML =
        '<span class="group-num">' + escHtml(g.num) + '</span>' +
        '<span class="group-title">' + escHtml(g.title) + '</span>' +
        '<span class="group-count">' + shown.length + ' sản phẩm</span>';
      var tbl = document.createElement("table");
      tbl.innerHTML =
        '<colgroup><col style="width:60px"><col><col style="width:135px"><col style="width:95px"><col style="width:80px"><col style="width:80px"></colgroup>' +
        '<thead><tr><th></th><th>Sản phẩm</th><th>Giá hiện tại</th><th>Giá mặc định</th><th>Lưu</th><th>Ẩn/Hiện</th></tr></thead>';
      var tb = document.createElement("tbody");
      shown.forEach(function(p){
        var cur = stagedPrice(p.src);
        var hid = stagedHidden(p.src);
        var nv = stagedName(p.src).vi;
        var ne = stagedName(p.src).en;
        var renamed = !!stagedName(p.src).renamed;
        var priceStaged = hashOwn(dirty, p.src);
        var hideStaged = hashOwn(dirtyHidden, p.src);
        var tr = document.createElement("tr");
        tr.className = hid ? "row-hidden" : "";
        tr.innerHTML =
          '<td><img class="prod-thumb" src="' + escAttr(p.src) + '" onerror="this.style.display=\'none\'"></td>' +
          '<td><div class="prod-name">' + escHtml(nv) + '</div><div class="prod-en">' + escHtml(ne) + '</div>' +
          '<div class="prod-meta">' + escHtml(p.brand) + ' · ' + escHtml(p.weight) + (hid ? ' · <span class="hid-badge">Đã ẩn</span>' : '') + (renamed ? ' · <span class="hid-badge" style="background:#eaf2f7;color:#2a6f97">Đã đổi tên</span>' : '') + '</div>' +
          '<button class="rename-btn" data-rename="' + escAttr(p.src) + '" title="Đổi tên">✎</button></td>' +
          '<td><input class="price-input' + (priceStaged ? ' changed' : '') + '" data-src="' + escAttr(p.src) + '" type="number" min="0" step="1" value="' + cur + '"></td>' +
          '<td><span class="price-def">' + money(p.price) + '</span></td>' +
          '<td><button class="save-btn' + (priceStaged ? ' staged' : '') + '" data-save="' + escAttr(p.src) + '">' + (priceStaged ? 'Đã sửa' : 'Lưu') + '</button></td>' +
          '<td><button class="hide-btn' + (hid ? ' hidden' : '') + (hideStaged ? ' staged' : '') + '" data-hide="' + escAttr(p.src) + '">' + (hid ? 'Hiện' : 'Ẩn') + '</button></td>';
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      var blk = document.createElement("div");
      blk.className = "group-block";
      blk.appendChild(head);
      blk.appendChild(tbl);
      box.appendChild(blk);
    });
    var total = Object.keys(gmap).reduce(function(s, gn){ return s + (gmap[gn].items.filter(function(p){
      var q2 = q;
      if (!q2) return true;
      var nv = stagedName(p.src).vi;
      var ne = stagedName(p.src).en;
      return nv.toLowerCase().indexOf(q2) >= 0 || ne.toLowerCase().indexOf(q2) >= 0 || p.brand.toLowerCase().indexOf(q2) >= 0;
    }).length); }, 0);
    var status = $("summary");
    updateSummary();
  }

  function updateSummary(){
    var changed = Object.keys(dirty).length + Object.keys(dirtyHidden).length + Object.keys(dirtyNames).length;
    var hiddenCount = 0;
    products.forEach(function(p){ if (stagedHidden(p.src)) hiddenCount++; });
    var el = $("summary");
    if (!el) return;
    el.innerHTML =
      '<span class="stat">Tổng: <b>' + products.length + '</b> sản phẩm</span>' +
      '<span class="stat">Đang ẩn: <b>' + hiddenCount + '</b></span>' +
      (changed
        ? '<span class="stat warn">' + changed + ' thay đổi chưa lưu</span>'
        : '<span class="stat">Không có thay đổi chờ lưu</span>');
  }

  // ---- staged-state helpers ----
  function stagedPrice(src){
    if (hashOwn(dirty, src)) return dirty[src];
    if (hashOwn(overrides, src)) return overrides[src];
    var p = findProd(src);
    return p ? p.price : 0;
  }

  function stagedHidden(src){
    if (hashOwn(dirtyHidden, src)) return !!dirtyHidden[src];
    return hidden.indexOf(src) >= 0;
  }

  function stagedName(src){
    var p = findProd(src) || { vi: "", en: "" };
    var base = { vi: p.vi, en: p.en, renamed: false };
    if (hashOwn(dirtyNames, src)) return { vi: dirtyNames[src].vi || p.vi, en: dirtyNames[src].en || p.en, renamed: true };
    if (hashOwn(names, src)) return { vi: names[src].vi || p.vi, en: names[src].en || p.en, renamed: true };
    return base;
  }

  function hashOwn(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }
  function escHtml(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
  function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

  function bindEvents(){
    $("search").addEventListener("input", render);

    $("groups").addEventListener("input", function(e){
      if (e.target.classList.contains("price-input")){
        // Chỉ đánh dấu pending — KHÔNG stage, không render, không toast.
        var btn = e.target.closest("tr").querySelector("[data-save]");
        if (btn){
          btn.textContent = "Lưu";
          btn.classList.add("pending");
        }
        e.target.classList.add("changed");
      }
    });

    $("groups").addEventListener("click", function(e){
      var btn = e.target.closest("[data-save]");
      if (btn){
        // Chỉ khi bấm "Lưu" thì sửa mới được tính là xong ở sản phẩm này.
        var src = btn.getAttribute("data-save");
        dirty[src] = Number(btn.closest("tr").querySelector('input[data-src="'+src+'"]').value);
        render();
        updateSaveAllState();
        showMsg("Đã lưu tạm sản phẩm. Nhấn “Lưu tất cả thay đổi” ở trên để áp dụng.");
        return;
      }
      var hbtn = e.target.closest("[data-hide]");
      if (hbtn){
        var hsrc = hbtn.getAttribute("data-hide");
        var next = !stagedHidden(hsrc);
        dirtyHidden[hsrc] = next;
        render();
        updateSaveAllState();
        showMsg((next ? "Sẽ ẩn" : "Sẽ hiện") + " sản phẩm sau khi lưu tất cả.");
        return;
      }
      var rbtn = e.target.closest("[data-rename]");
      if (rbtn){
        openRename(rbtn);
        return;
      }
      var sbtn = e.target.closest("[data-rename-save]");
      if (sbtn){
        stageNameSave(sbtn.closest("[data-rename-form]").getAttribute("data-rename-form"));
        return;
      }
      var cbtn = e.target.closest("[data-rename-cancel]");
      if (cbtn){
        render();
        return;
      }
      var rbtn2 = e.target.closest("[data-rename-reset]");
      if (rbtn2){
        stageNameReset(rbtn2.closest("[data-rename-form]").getAttribute("data-rename-form"));
      }
    });

    $("saveAllBtn").addEventListener("click", openPublishModal);
    $("histBtn").addEventListener("click", openHistory);
    $("logoutBtn").addEventListener("click", function(){ localStorage.removeItem(PWD_KEY); location.reload(); });

    $("descCancel").addEventListener("click", closePublishModal);
    $("descOk").addEventListener("click", publishAll);
    $("histClose").addEventListener("click", function(){ $("histModal").classList.remove("open"); });
    $("histList").addEventListener("click", function(e){
      var rb = e.target.closest("[data-restore]");
      if (rb) restoreVersion(rb.getAttribute("data-restore"));
    });
  }

  function updateSaveAllState(){
    var n = Object.keys(dirty).length + Object.keys(dirtyHidden).length + Object.keys(dirtyNames).length;
    var btn = $("saveAllBtn");
    btn.textContent = n ? "Lưu tất cả thay đổi (" + n + ")" : "Lưu tất cả thay đổi";
    btn.classList.toggle("has-pending", n > 0);
    updateSummary();
  }

  function authHeaders(){
    var h = { "Content-Type": "application/json" };
    var pwd = localStorage.getItem(PWD_KEY) || "";
    if (pwd) h["x-admin-password"] = pwd;
    return h;
  }

  function findProd(src){
    for (var i=0;i<products.length;i++){ if (products[i].src === src) return products[i]; }
    return null;
  }

  function openRename(btn){
    var src = btn.getAttribute("data-rename");
    var p = findProd(src);
    if (!p) return;
    var cur = stagedName(src);
    var cell = btn.closest("td");
    var form = document.createElement("div");
    form.className = "rename-form";
    form.setAttribute("data-rename-form", src);
    form.innerHTML =
      '<input class="rename-vi" value="' + escAttr(cur.vi) + '" placeholder="Tên tiếng Việt">' +
      '<input class="rename-en" value="' + escAttr(cur.en) + '" placeholder="Tên tiếng Anh">' +
      '<div class="rename-row">' +
        '<button type="button" class="rename-save" data-rename-save="1">Lưu tên</button>' +
        '<button type="button" class="rename-cancel" data-rename-cancel="1">Hủy</button>' +
        '<button type="button" class="rename-cancel" data-rename-reset="1" title="Khôi phục tên mặc định">Khôi phục</button>' +
      '</div>';
    cell.appendChild(form);
    btn.style.display = "none";
  }

  function stageNameSave(src){
    var form = document.querySelector('[data-rename-form="' + src + '"]');
    if (!form) return;
    var vi = form.querySelector(".rename-vi").value.trim();
    var en = form.querySelector(".rename-en").value.trim();
    if (!vi && !en){ render(); return; }
    dirtyNames[src] = { vi: vi, en: en };
    render();
    updateSaveAllState();
    showMsg("Đã lưu tạm tên sản phẩm. Nhấn “Lưu tất cả thay đổi” để áp dụng.");
  }

  function stageNameReset(src){
    var p = findProd(src);
    if (!p) return;
    dirtyNames[src] = { vi: p.vi, en: p.en };
    render();
    updateSaveAllState();
    showMsg("Đã khôi phục tên mặc định (sẽ áp dụng khi lưu tất cả).");
  }

  // ---- Publish all staged changes ----
  function openPublishModal(){
    var n = Object.keys(dirty).length + Object.keys(dirtyHidden).length + Object.keys(dirtyNames).length;
    if (!n){ showMsg("Không có thay đổi nào để lưu."); return; }
    $("descSummary").textContent = n + " thay đổi đang chờ được lưu.";
    $("descInput").value = "";
    $("descModal").classList.add("open");
    setTimeout(function(){ $("descInput").focus(); }, 50);
  }

  function closePublishModal(){ $("descModal").classList.remove("open"); }

  function publishAll(){
    var desc = $("descInput").value.trim();
    if (!desc){ $("descInput").style.borderColor = "#e74c3c"; return; }
    $("descInput").style.borderColor = "";
    var next = computeMergedState();
    $("descOk").disabled = true;
    fetch("/api/publish", { method: "PUT", headers: authHeaders(), body: JSON.stringify({ desc: desc, overrides: next.overrides, hidden: next.hidden, names: next.names }) })
      .then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
      .then(function(t){
        if (!t.r.ok){ throw new Error(t.d.error || "Lỗi"); }
        overrides = t.d.overrides || {};
        hidden = t.d.hidden || [];
        names = t.d.names || {};
        versions = t.d.versions || [];
        dirty = {}; dirtyHidden = {}; dirtyNames = {};
        closePublishModal();
        render();
        updateSaveAllState();
        showMsg("Đã lưu tất cả thay đổi.");
      })
      .catch(function(err){
        showMsg("Lỗi: " + err.message);
        if (err.message.indexOf("401") >= 0 || err.message.indexOf("Sai mật khẩu") >= 0){ logoutLocal(); }
      })
      .finally(function(){ runInline(null, function(){ $("descOk").disabled = false; }); });
  }

  function computeMergedState(){
    // prices: staged dirty overrides saved
    var ov = Object.keys(overrides).reduce(function(o, src){ o[src] = overrides[src]; return o; }, {});
    Object.keys(dirty).forEach(function(src){
      if (dirty[src] > 0) ov[src] = dirty[src];
      else delete ov[src];
    });
    // hidden
    var hidSet = hidden.slice();
    Object.keys(dirtyHidden).forEach(function(src){
      var idx = hidSet.indexOf(src);
      if (dirtyHidden[src]){ if (idx < 0) hidSet.push(src); }
      else if (idx >= 0) hidSet.splice(idx, 1);
    });
    // names: staged dirtyNames overrides saved
    var nm = Object.keys(names).reduce(function(o, src){ o[src] = { vi: names[src].vi, en: names[src].en }; return o; }, {});
    Object.keys(dirtyNames).forEach(function(src){
      var p = findProd(src);
      if (!dirtyNames[src].vi && !dirtyNames[src].en && !(p && p.vi === dirtyNames[src].vi)) {
        delete nm[src];
      } else if (dirtyNames[src].vi || dirtyNames[src].en) {
        nm[src] = { vi: dirtyNames[src].vi, en: dirtyNames[src].en };
      }
    });
    return { overrides: ov, hidden: hidSet, names: nm };
  }

  // ---- History ----
  function openHistory(){
    fetch("/api/history", { headers: authHeaders() })
      .then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
      .then(function(t){
        if (!t.r.ok){ throw new Error(t.d.error || "Lỗi"); }
        versions = t.d.versions || [];
        renderHistory();
        $("histModal").classList.add("open");
      })
      .catch(function(err){
        showMsg("Lỗi: " + err.message);
        if (err.message.indexOf("401") >= 0 || err.message.indexOf("Sai mật khẩu") >= 0){ logoutLocal(); }
      });
  }

  function renderHistory(){
    var box = $("histList");
    box.innerHTML = "";
    if (!versions.length){
      box.innerHTML = '<div class="hist-empty">Chưa có lịch sử thay đổi.</div>';
      return;
    }
    versions.forEach(function(v){
      var item = document.createElement("div");
      item.className = "hist-item";
      var t = new Date(v.at).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
      item.innerHTML =
        '<div class="h-time">' + escHtml(t) + '</div>' +
        '<div class="h-desc">' + escHtml(v.desc || "") + '</div>' +
        '<button class="hist-restore" data-restore="' + escAttr(v.id) + '">Khôi phục</button>';
      box.appendChild(item);
    });
  }

  function restoreVersion(id){
    var v = null;
    for (var i=0;i<versions.length;i++){ if (versions[i].id === id){ v = versions[i]; break; } }
    if (!v) return;
    var t = new Date(v.at).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    if (!confirm("Khôi phục trạng thái từ phiên bản lúc " + t + "?\n\nHiện tại: " + (v.desc || "(không mô tả)") + "\n\nCác thay đổi chưa lưu sẽ bị mất.")) return;
    fetch("/api/restore", { method: "POST", headers: authHeaders(), body: JSON.stringify({ id: id }) })
      .then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
      .then(function(t2){
        if (!t2.r.ok){ throw new Error(t2.d.error || "Lỗi"); }
        overrides = t2.d.overrides || {};
        hidden = t2.d.hidden || [];
        names = t2.d.names || {};
        versions = t2.d.versions || [];
        dirty = {}; dirtyHidden = {}; dirtyNames = {};
        $("histModal").classList.remove("open");
        render();
        updateSaveAllState();
        showMsg("Đã khôi phục phiên bản cũ.");
      })
      .catch(function(err){
        showMsg("Lỗi: " + err.message);
        if (err.message.indexOf("401") >= 0 || err.message.indexOf("Sai mật khẩu") >= 0){ logoutLocal(); }
      });
  }

  function logoutLocal(){ localStorage.removeItem(PWD_KEY); location.reload(); }

  function runInline(btn, fn){ try{ fn(); }catch(e){} }

  function bootstrap(){
    // Load product catalog
    fetch("/products.json")
      .then(function(r){ return r.json(); })
      .then(function(list){
        products = list;
        return fetch("/api/prices", { headers: authHeaders() });
      })
      .then(function(r){ return r.json(); })
      .then(function(d){ overrides = d.overrides || {}; hidden = d.hidden || []; names = d.names || {}; versions = d.versions || []; })
      .then(render)
      .then(updateSummary)
      .catch(function(err){ showMsg("Không tải được dữ liệu: " + err.message); });
  }

  // ---- Login flow ----
  var saved = localStorage.getItem(PWD_KEY);
  if (saved){
    $("app").style.display = "block";
    $("loginScreen").style.display = "none";
    bindEvents();
    bootstrap();
  } else {
    $("loginBtn").addEventListener("click", tryLogin);
    $("pwd").addEventListener("keydown", function(e){ if (e.key === "Enter") tryLogin(); });
  }

  function tryLogin(){
    var pwd = $("pwd").value;
    fetch("/api/auth/verify", { headers: { "x-admin-password": pwd } })
      .then(function(r){
        if (r.status === 401) throw new Error("pwd");
        return r.json();
      })
      .then(function(){
        localStorage.setItem(PWD_KEY, pwd);
        $("app").style.display = "block";
        $("loginScreen").style.display = "none";
        bindEvents();
        bootstrap();
      })
      .catch(function(){ $("loginErr").textContent = "Sai mật khẩu."; });
  }
})();
</script>
</body>
</html>
