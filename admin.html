<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý sản phẩm | Khải Thịnh</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Be Vietnam Pro", system-ui, Arial, sans-serif; background: #eef4f0; color: #13251e; }
  img { -webkit-user-drag: none; }

  /* ===== Header nền xanh dương đậm — logo nổi bật ===== */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: linear-gradient(90deg, #14304e 0%, #1b4d86 100%);
    border-bottom: 3px solid #f0c049;
    box-shadow: 0 2px 12px rgba(9,26,46,.35);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar .brand-logo { height: 51px; width: auto; background: #fff; padding: 5px 7px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.32); }
  .topbar h1 { font-size: 18px; font-weight: 800; letter-spacing: .5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .topbar .sub { font-size: 12px; color: #cfe0f5; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .topbar .logout { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .topbar .logout:hover { background: rgba(255,255,255,.14); }
  .topbar .hist-btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55); padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; font-weight: 600; }
  .topbar .hist-btn:hover { background: rgba(255,255,255,.14); border-color: #f0c049; }
  .topbar .save-all { background: linear-gradient(135deg, #f0c049, #d9771a); color: #fff; border: none; padding: 10px 18px; border-radius: 9px; font-weight: 800; cursor: pointer; font-size: 13px; white-space: nowrap; box-shadow: 0 3px 8px rgba(217,119,26,.45); }
  .topbar .save-all:hover { filter: brightness(1.06); }
  .topbar .save-all:disabled { background: #b8c4bd; box-shadow: none; cursor: not-allowed; filter: none; }
  .topbar .save-all.has-pending { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,128,32,.55); } 50% { box-shadow: 0 0 0 9px rgba(224,128,32,0); } }

  .toolbar { max-width: 1100px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 240px; padding: 12px 16px; border: 1px solid #cfdbd4; border-radius: 10px; font-size: 14px; background: #fff; box-shadow: 0 1px 3px rgba(11,51,39,.05); }
  .toolbar input[type=search]:focus { outline: 2px solid #b7dfc9; border-color: #10b981; }
  .toolbar .status { font-size: 13px; color: #0b6b3f; font-weight: 700; white-space: nowrap; }

  .summary { max-width: 1100px; margin: 14px auto 0; padding: 0 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stat { background: #fff; border: 1px solid #e2ece5; border-radius: 18px; padding: 6px 14px; font-size: 12.5px; color: #40564c; box-shadow: 0 1px 3px rgba(11,51,39,.05); }
  .stat b { color: #0b3b2b; }
  .stat.warn { background: #fff4e5; border-color: #f0c98a; color: #9a5b0e; font-weight: 700; }

  .wrap { max-width: 1100px; margin: 16px auto 44px; padding: 0 16px; }
  .group-block { margin-bottom: 20px; background: #fff; border: 1px solid #e2ece5; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(11,51,39,.07); }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #14304e, #1b4d86); color: #fff; cursor: pointer; user-select: none; }
  .group-chevron { margin-left: auto; width: 18px; height: 18px; transition: transform .2s ease; color: #cfe0f5; flex-shrink: 0; }
  .group-block.collapsed .group-chevron { transform: rotate(-90deg); }
  .group-block.collapsed table { display: none; }
  .group-num { background: linear-gradient(135deg, #f0c049, #d9771a); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 11px; border-radius: 10px; box-shadow: 0 2px 5px rgba(217,119,26,.35); }
  .group-title { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
  .group-rename-btn { background: none; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; color: #cfe0f5; cursor: pointer; padding: 2px 8px; font-size: 12px; line-height: 1.5; }
  .group-rename-btn:hover { background: rgba(255,255,255,.16); border-color: #f0c049; }
  .group-del-btn { background: none; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; color: #ffd0ca; cursor: pointer; padding: 2px 8px; font-size: 12px; line-height: 1.5; }
  .group-del-btn:hover { background: rgba(231,76,60,.22); border-color: #e74c3c; }
  .group-move-select { padding: 7px 8px; border: 1px solid #cdd9d2; border-radius: 7px; font-size: 12.5px; width: 100%; background: #fff; color: #13251e; }
  .group-edit-form { display: inline-flex; gap: 8px; align-items: center; }
  .group-edit-form input { padding: 6px 9px; border: 1px solid #cdd9d2; border-radius: 6px; font-size: 13px; background: #fff; color: #13251e; min-width: 260px; }
  .group-edit-form button { padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 12.5px; cursor: pointer; border: none; }
  .group-count { font-size: 12px; color: #d3e8dd; white-space: nowrap; background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 12px; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #eef2ef; font-size: 13.5px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  th { background: #f0f6f3; color: #0b3b2b; font-weight: 700; white-space: nowrap; }
  th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { text-align: center; }
  tbody tr:hover td { background: #fafdfb; }
  .save-btn, .hide-btn { width: 60px; display: inline-block; }
  .drag-handle { cursor: grab; color: #9db0a5; font-size: 16px; user-select: none; padding: 2px; display: inline-block; vertical-align: middle; }
  .drag-handle:hover { color: #1b4d86; }
  tr.dragging { opacity: .35; }
  tr.drag-over td { box-shadow: inset 0 2px 0 0 #1b4d86; }
  .prod-thumb { width: 120px; height: 120px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid #e2e8e4; }
  .prod-name { font-weight: 600; color: #0b3327; }
  .prod-en { font-size: 12px; color: #7a8a82; }
  .prod-meta { font-size: 12px; color: #55685f; margin-top: 2px; }
  .rename-btn { background: none; border: 1px solid #cdd9d2; border-radius: 6px; color: #0b3b2b; cursor: pointer; padding: 4px 8px; font-size: 13px; margin-top: 6px; }
  .rename-btn:hover { background: #eef5f1; border-color: #10b981; }
  .rename-form { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .rename-form input { padding: 7px 9px; border: 1px solid #cdd9d2; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; }
  .rename-row { display: flex; gap: 6px; align-items: center; }
  .rename-row button { padding: 7px 12px; border-radius: 6px; font-weight: 700; font-size: 12.5px; cursor: pointer; border: none; }
  .rename-save { background: #10b981; color: #fff; }
  .rename-save:hover { background: #0da06f; }
  .rename-cancel { background: #eef1ef; color: #33443c; }
  .rename-cancel:hover { background: #dfe6e2; }
  .price-input { width: 135px; padding: 8px 10px; border: 1px solid #cdd9d2; border-radius: 8px; font-size: 14px; text-align: right; }
  .price-input.changed { border-color: #e08020; background: #fff7ec; }
  .save-btn { background: #10b981; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .save-btn:hover { background: #0da06f; }
  .save-btn:disabled { background: #b8c4bd; cursor: not-allowed; }
  .save-btn.staged { background: #ffd9a8; color: #7a3d00; border: 1px solid #f5b96c; }
  .save-btn.staged:hover { background: #f9c98f; }
  .save-btn.pending { box-shadow: inset 0 0 0 2px #e08020; background: #10b981; }
  .save-btn.pending:hover { background: #0da06f; }
  .hide-btn.staged { box-shadow: inset 0 0 0 2px #e08020; }
  .hide-btn { background: #e74c3c; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .hide-btn:hover { background: #c0392b; }
  .hide-btn.hidden { background: #10b981; }
  .hide-btn.hidden:hover { background: #0da06f; }
  .row-hidden td { opacity: .55; }
  .hid-badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#fdecea; color:#c0392b; font-weight:700; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#eef5f1; color:#0b6b3f; }
  .msg { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #13251e; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; z-index: 60; opacity: 0; transition: opacity .25s; box-shadow: 0 6px 16px rgba(0,0,0,.22); }
  .msg.show { opacity: 1; }
  .login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #14304e, #1b4d86 50%, #0e3a6b); display: flex; align-items: center; justify-content: center; z-index: 70; }
  .login-box { background: #fff; padding: 34px 32px; border-radius: 16px; width: 340px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .login-box .brand-logo { height: 56px; width: auto; margin-bottom: 12px; }
  .login-box h2 { font-size: 17px; color: #0b3327; margin-bottom: 16px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #cdd9d2; border-radius: 9px; font-size: 15px; margin-bottom: 14px; }
  .login-box input:focus { outline: 2px solid #b7dfc9; border-color: #10b981; }
  .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0b3b2b, #15614a); color: #fff; border: none; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 15px; }
  .login-box button:hover { filter: brightness(1.08); }
  .login-box .err { color: #c0392b; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .count { font-size: 12px; color: #7a8a82; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(11,26,21,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 520px; max-width: 94vw; max-height: 84vh; overflow: auto; padding: 24px; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size: 16px; color: #0b3327; margin-bottom: 12px; }
  .modal textarea { width: 100%; padding: 11px 14px; border: 1px solid #cdd9d2; border-radius: 8px; font-size: 14px; min-height: 74px; resize: vertical; box-sizing: border-box; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .modal-actions button { padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; border: none; }
  .modal-actions .ok { background: #e08020; color: #fff; }
  .modal-actions .ok:hover { background: #c96f17; }
  .modal-actions .cancel { background: #eef1ef; color: #33443c; }
  .modal-actions .cancel:hover { background: #dfe6e2; }
  .hist-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #eef2ef; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .h-time { font-size: 12px; color: #7a8a82; min-width: 148px; }
  .hist-item .h-desc { flex: 1; font-size: 13.5px; color: #13251e; }
  .hist-item .h-chips { white-space: nowrap; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; color: #7a8a82; }
  .hist-restore { background: #10b981; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .hist-restore:hover { background: #0da06f; }
  .hist-empty { color: #7a8a82; font-size: 13px; padding: 12px 0; }
  .pending-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: transparent; margin-right: 6px; }
  .pending-dot.on { background: #e08020; }

  /* ===== Bìa PDF panel ===== */
  .cover-panel { max-width: 1100px; margin: 16px auto 0; padding: 0 16px; }
  .cover-panel .cover-inner { background: #fff; border: 1px solid #e2ece5; border-radius: 14px; box-shadow: 0 4px 14px rgba(11,51,39,.07); overflow: hidden; }
  .cover-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #14304e, #1b4d86); color: #fff; cursor: pointer; user-select: none; }
  .cover-head .cover-title { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
  .cover-head .cover-sub { font-size: 11.5px; color: #cfe0f5; }
  .cover-count { font-size: 12px; color: #d3e8dd; background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
  .cover-chevron { margin-left: auto; width: 18px; height: 18px; transition: transform .2s ease; color: #cfe0f5; flex-shrink: 0; }
  .cover-panel.collapsed .cover-chevron { transform: rotate(-90deg); }
  .cover-panel.collapsed .cover-body { display: none; }
  .cover-body { padding: 16px; }
  .cover-picker-top { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .cover-picker-top input[type=search] { flex: 1; min-width: 220px; padding: 9px 12px; border: 1px solid #cfdbd4; border-radius: 8px; font-size: 13px; }
  .cover-picker-top input[type=search]:focus { outline: 2px solid #b7dfc9; border-color: #10b981; }
  .cover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; max-height: 340px; overflow: auto; padding: 2px; }
  .cover-cell { display: flex; gap: 10px; align-items: center; border: 1px solid #e2ece5; border-radius: 10px; padding: 8px; background: #fafdfb; }
  .cover-cell.on { border-color: #10b981; background: #eefaf4; }
  .cover-cell img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid #e6ece8; flex-shrink: 0; }
  .cover-cell .cc-name { font-size: 12px; font-weight: 600; color: #0b3327; line-height: 1.25; flex: 1; }
  .cover-cell .cc-src { font-size: 10px; color: #93a39b; word-break: break-all; }
  .cover-cell button { border: none; border-radius: 7px; padding: 6px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .cover-cell .cc-add { background: #10b981; color: #fff; }
  .cover-cell .cc-add:hover { background: #0da06f; }
  .cover-cell .cc-del { background: #e74c3c; color: #fff; }
  .cover-cell .cc-del:hover { background: #c0392b; }
  .cover-list-title { font-size: 12.5px; color: #40564c; font-weight: 700; margin: 14px 0 8px; display: flex; align-items: center; gap: 8px; }
  .cover-ordered { display: flex; flex-direction: column; gap: 6px; }
  .cover-ordered .cos-row { display: flex; align-items: center; gap: 8px; border: 1px solid #e2ece5; border-radius: 9px; padding: 6px 8px; background: #fff; }
  .cover-ordered .cos-idx { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #f0c049, #d9771a); color: #fff; font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .cover-ordered img { width: 38px; height: 38px; object-fit: contain; background: #fff; border: 1px solid #e6ece8; border-radius: 6px; flex-shrink: 0; }
  .cover-ordered .cos-name { flex: 1; font-size: 12px; font-weight: 600; color: #0b3327; }
  .cover-ordered .cos-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .cover-ordered .cos-btns button { border: 1px solid #cdd9d2; background: #f0f6f3; border-radius: 6px; width: 26px; height: 26px; cursor: pointer; color: #0b3b2b; font-size: 14px; line-height: 1; }
  .cover-ordered .cos-btns button:disabled { opacity: .35; cursor: not-allowed; }
  .cover-ordered .cos-btns button:hover:enabled { background: #dfeae4; }
  .cover-ordered .cos-del { border: 1px solid #f5c4be !important; background: #fdecea !important; color: #c0392b !important; }
  .cover-empty { color: #7a8a82; font-size: 12.5px; padding: 8px 0; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <img src="assets/logo.png" alt="Khải Thịnh" class="brand-logo">
    <h2>Quản lý sản phẩm</h2>
    <input type="password" id="pwd" placeholder="Mật khẩu quản trị" autocomplete="current-password">
    <button id="loginBtn">Đăng nhập</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <img src="assets/logo.png" alt="Khải Thịnh" class="brand-logo">
      <div>
        <h1>Quản lý sản phẩm</h1>
        <div class="sub">Công ty TNHH TM DV Khải Thịnh · Catalogue 2026</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="save-all" id="saveAllBtn" disabled>Lưu tất cả thay đổi</button>
      <a class="hist-btn" href="/catalogue" target="_blank" rel="noreferrer" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">Catalogue <span style="font-size:12px;opacity:.8">↗</span></a>
      <button class="hist-btn" id="histBtn">Lịch sử</button>
      <button class="logout" id="logoutBtn" title="Thoát" aria-label="Thoát"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Tìm sản phẩm...">
  </div>

  <div class="summary" id="summary"></div>

  <div class="cover-panel" id="coverPanel">
    <div class="cover-inner">
      <div class="cover-head" id="coverHead">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#f0c049;flex-shrink:0"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>
        <div>
          <div class="cover-title">Bìa PDF — sản phẩm nổi bật</div>
          <div class="cover-sub">Chọn sản phẩm xuất hiện trên bìa catalogue khi in / xuất PDF</div>
        </div>
        <span class="cover-count" id="coverCount">0 sản phẩm</span>
        <svg class="cover-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="cover-body">
        <div class="cover-picker-top">
          <input type="search" id="coverSearch" placeholder="Tìm sản phẩm để thêm vào bìa...">
        </div>
        <div class="cover-grid" id="coverGrid"></div>
        <div class="cover-list-title">Thứ tự bìa (số nhỏ = lên trước, kéo/đổi thứ tự)</div>
        <div class="cover-ordered" id="coverOrdered"></div>
      </div>
    </div>
  </div>

  <div class="wrap" id="groups">
  </div>
</div>

<div class="modal-overlay" id="descModal">
  <div class="modal">
    <h3>Lưu tất cả thay đổi</h3>
    <div class="count" id="descSummary"></div>
    <textarea id="descInput" placeholder="Nhập mô tả thay đổi (bắt buộc)…"></textarea>
    <div class="modal-actions">
      <button class="cancel" id="descCancel">Hủy</button>
      <button class="ok" id="descOk">Lưu thay đổi</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="histModal">
  <div class="modal">
    <h3>Lịch sử thay đổi</h3>
    <div id="histList"></div>
    <div class="modal-actions">
      <button class="cancel" id="histClose">Đóng</button>
    </div>
  </div>
</div>

<div class="msg" id="msg"></div>

<script>
(function(){
  "use strict";
  var PWD_KEY = "kt-admin-pwd";
  var overrides = {};       // src -> price (saved)
  var names = {};           // src -> {vi, en} (saved)
  var hidden = [];          // srcs of hidden products (saved)
  var orders = {};          // legacy group_num -> [src,...] (pre-layout reorder, for migration)
  var groupLayout = null;    // [{num,title,srcs:[...]}] (saved authoritative groups)
  var cover = null;          // [src,...] products shown on the PDF cover (saved)
  var products = [];         // from products.json
  var dirty = {};            // src -> price (staged edits)
  var dirtyHidden = {};      // src -> bool (staged hide state, only entries staged)
  var dirtyNames = {};       // src -> {vi,en} (staged name edits)
  var dirtyLayout = null;    // staged authoritative group layout [{num,title,srcs}]
  var layoutDirty = false;   // true when staged layout differs from saved
  var dirtyCover = null;     // staged cover [src,...]
  var coverDirty = false;    // true when staged cover differs from saved
  var versions = [];         // [{id, at, desc, snapshot}]
  var sortKey = "src";
  var COLLAPSE_KEY = "kt-admin-collapsed";
  var collapsed = {};        // group_num -> true (collapsed)
  try { collapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || {}; } catch(e){ collapsed = {}; }

  function $(id){ return document.getElementById(id); }

  function showMsg(t){
    var m = $("msg"); m.textContent = t; m.classList.add("show");
    clearTimeout(m._t); m._t = setTimeout(function(){ m.classList.remove("show"); }, 2200);
  }

  function money(v){ return (v==null || v===0) ? "—" : v.toLocaleString("vi-VN") + " ₫"; }
  function fmtPrice(v){ if (v==null || v==="") return ""; var n = Number(String(v).replace(/[^\d]/g,"")); if (isNaN(n)) return ""; return n.toLocaleString("vi-VN"); }

  function render(){
    var q = $("search").value.trim().toLowerCase();
    var box = $("groups");
    box.innerHTML = "";
    // groups come from the authoritative layout (order + membership + numbering)
    var gl = effectiveLayout();
    var bySrc = {};
    products.forEach(function(p){ bySrc[p.src] = p; });
    var rendered = 0;
    gl.forEach(function(g, gi){
      // members = products resolved from srcs (keep layout order)
      var items = [];
      var gtitle = g.title || "";
      g.srcs.forEach(function(src){ if (bySrc[src]) items.push(bySrc[src]); });
      var shown = items.filter(function(p){
        if (!q) return true;
        var nv = stagedName(p.src).vi;
        var ne = stagedName(p.src).en;
        return nv.toLowerCase().indexOf(q) >= 0 || ne.toLowerCase().indexOf(q) >= 0 || p.brand.toLowerCase().indexOf(q) >= 0;
      });
      if (!shown.length) return;
      rendered++;
      var head = document.createElement("div");
      head.className = "group-head";
      head.innerHTML =
        '<span class="group-num">' + escHtml(g.num) + '</span>' +
        '<span class="group-title">' + escHtml(gtitle) + '</span>' +
        '<button class="group-rename-btn" data-group-rename="' + escAttr(g.num) + '" title="Đổi tên nhóm">✎</button>' +
        '<button class="group-del-btn" data-group-del="' + escAttr(g.num) + '" title="Xóa nhóm (gộp SP và đánh số lại)">🗑</button>' +
        '<span class="group-count">' + items.length + ' sản phẩm</span>' +
        '<svg class="group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
      var tbl = document.createElement("table");
      tbl.innerHTML =
        '<colgroup><col style="width:140px"><col style="width:30px"><col><col style="width:145px"><col style="width:95px"><col style="width:80px"><col style="width:130px"></colgroup>' +
        '<thead><tr><th></th><th></th><th>Sản phẩm</th><th>Giá hiện tại</th><th>Lưu</th><th>Ẩn/Hiện</th><th>Chuyển nhóm</th></tr></thead>';
      var tb = document.createElement("tbody");
      var groupOptions = effectiveLayout();
      shown.forEach(function(p){
        var cur = stagedPrice(p.src);
        var hid = stagedHidden(p.src);
        var nv = stagedName(p.src).vi;
        var ne = stagedName(p.src).en;
        var renamed = !!stagedName(p.src).renamed;
        var priceStaged = hashOwn(dirty, p.src);
        var hideStaged = hashOwn(dirtyHidden, p.src);
        var moveOpts = groupOptions.filter(function(og){ return og.num !== g.num; });
        var moveHtml = '<select class="group-move-select" data-move="' + escAttr(p.src) + '" title="Di chuyển sản phẩm sang nhóm khác"><option value="">' + escHtml(g.num) + '</option>';
        moveOpts.forEach(function(og){ moveHtml += '<option value="' + escAttr(og.num) + '">' + escHtml(og.num) + ' · ' + escHtml(og.title) + '</option>'; });
        moveHtml += '</select>';
        var tr = document.createElement("tr");
        tr.className = hid ? "row-hidden" : "";
        tr.setAttribute("data-group", g.num);
        tr.setAttribute("data-src", p.src);
        tr.setAttribute("draggable", "true");
        tr.innerHTML =
          '<td><img class="prod-thumb" src="' + escAttr(p.src) + '" onerror="this.style.display=\'none\'"></td>' +
          '<td><span class="drag-handle" title="Kéo để sắp xếp">⠿</span></td>' +
          '<td><div class="prod-name">' + escHtml(nv) + '</div><div class="prod-en">' + escHtml(ne) + '</div>' +
          '<div class="prod-meta">' + escHtml(p.brand) + ' · ' + escHtml(p.weight) + (hid ? ' · <span class="hid-badge">Đã ẩn</span>' : '') + (renamed ? ' · <span class="hid-badge" style="background:#eaf2f7;color:#2a6f97">Đã đổi tên</span>' : '') + '</div>' +
          '<button class="rename-btn" data-rename="' + escAttr(p.src) + '" title="Đổi tên">✎</button></td>' +
          '<td><input class="price-input' + (priceStaged ? ' changed' : '') + '" data-src="' + escAttr(p.src) + '" type="text" inputmode="numeric" value="' + fmtPrice(cur) + '"></td>' +
          '<td><button class="save-btn' + (priceStaged ? ' staged' : '') + '" data-save="' + escAttr(p.src) + '">' + (priceStaged ? 'Đã sửa' : 'Lưu') + '</button></td>' +
          '<td><button class="hide-btn' + (hid ? ' hidden' : '') + (hideStaged ? ' staged' : '') + '" data-hide="' + escAttr(p.src) + '">' + (hid ? 'Hiện' : 'Ẩn') + '</button></td>' +
          '<td>' + moveHtml + '</td>';
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      var blk = document.createElement("div");
      blk.className = "group-block" + (collapsed[g.num] ? " collapsed" : "");
      blk.setAttribute("data-group-num", g.num);
      blk.appendChild(head);
      blk.appendChild(tbl);
      box.appendChild(blk);
    });
    renderCover();
    updateSummary();
  }

  // ---- Cover (PDF) selection ----
  function savedCover(){ return cover ? cover.slice() : []; }

  function effectiveCover(){
    if (dirtyCover) return dirtyCover.slice();
    return savedCover();
  }

  function stageCover(list){
    dirtyCover = list.slice();
    coverDirty = !arraysEqual(dirtyCover, savedCover());
  }

  function coverContains(src){
    return effectiveCover().indexOf(src) >= 0;
  }

  function toggleCover(src){
    var l = effectiveCover();
    var i = l.indexOf(src);
    if (i >= 0) l.splice(i, 1);
    else l.push(src);
    stageCover(l);
    renderCover();
    updateSaveAllState();
    showMsg(coverDirty ? "Đã cập nhật bìa PDF. Nhấn “Lưu tất cả thay đổi” để áp dụng." : "Bìa PDF đã trở về ban đầu — không tính là thay đổi.");
  }

  function moveCover(src, dir){
    var l = effectiveCover();
    var i = l.indexOf(src);
    if (i < 0) return;
    var j = i + dir;
    if (j < 0 || j >= l.length) return;
    var t = l[i]; l[i] = l[j]; l[j] = t;
    stageCover(l);
    renderCover();
    updateSaveAllState();
    showMsg(coverDirty ? "Đã đổi thứ tự bìa. Nhấn “Lưu tất cả thay đổi” để áp dụng." : "");
  }

  function arraysEqual(a, b){
    if (a.length !== b.length) return false;
    for (var i=0;i<a.length;i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function renderCover(){
    var q = ($("coverSearch") ? $("coverSearch").value : "").trim().toLowerCase();
    var sel = effectiveCover();
    var grid = $("coverGrid");
    var ordered = $("coverOrdered");
    var count = $("coverCount");
    if (!grid || !ordered) return;
    // Pick grid (all products, highlight selected)
    var shown = products.filter(function(p){
      if (!q) return true;
      var nv = stagedName(p.src).vi;
      var ne = stagedName(p.src).en;
      return nv.toLowerCase().indexOf(q) >= 0 || ne.toLowerCase().indexOf(q) >= 0 || p.brand.toLowerCase().indexOf(q) >= 0;
    });
    grid.innerHTML = "";
    shown.forEach(function(p){
      var on = sel.indexOf(p.src) >= 0;
      var cell = document.createElement("div");
      cell.className = "cover-cell" + (on ? " on" : "");
      cell.innerHTML =
        '<img src="' + escAttr(p.src) + '" onerror="this.style.display=\'none\'">' +
        '<div class="cc-info"><div class="cc-name">' + escHtml(stagedName(p.src).vi) + '</div><div class="cc-src">' + escHtml(p.src.split("/").pop()) + '</div></div>' +
        '<button class="' + (on ? 'cc-del' : 'cc-add') + '" data-cover-toggle="' + escAttr(p.src) + '">' + (on ? 'Bỏ' : 'Thêm') + '</button>';
      grid.appendChild(cell);
    });
    // Ordered list
    ordered.innerHTML = "";
    if (!sel.length){
      ordered.innerHTML = '<div class="cover-empty">Chưa chọn sản phẩm nào cho bìa. Hãy bấm “Thêm” ở các ô bên trên.</div>';
    } else {
      sel.forEach(function(src, idx){
        var p = findProd(src);
        var nm = p ? stagedName(p.src).vi : src;
        var row = document.createElement("div");
        row.className = "cos-row";
        row.innerHTML =
          '<div class="cos-idx">' + (idx + 1) + '</div>' +
          '<img src="' + escAttr(src) + '" onerror="this.style.display=\'none\'">' +
          '<div class="cos-name">' + escHtml(nm) + '</div>' +
          '<div class="cos-btns">' +
            '<button data-cover-up="' + escAttr(src) + '" ' + (idx === 0 ? 'disabled' : '') + ' title="Lên trên">↑</button>' +
            '<button data-cover-down="' + escAttr(src) + '" ' + (idx === sel.length - 1 ? 'disabled' : '') + ' title="Xuống dưới">↓</button>' +
            '<button class="cos-del" data-cover-toggle="' + escAttr(src) + '" title="Bỏ khỏi bìa">✕</button>' +
          '</div>';
        ordered.appendChild(row);
      });
    }
    count.textContent = sel.length + " sản phẩm";
  }

  function updateSummary(){
    var changed = Object.keys(dirty).length + Object.keys(dirtyHidden).length + Object.keys(dirtyNames).length + (layoutDirty ? 1 : 0) + (coverDirty ? 1 : 0);
    var hiddenCount = 0;
    products.forEach(function(p){ if (stagedHidden(p.src)) hiddenCount++; });
    var el = $("summary");
    if (!el) return;
    el.innerHTML =
      '<span class="stat">Tổng: <b>' + products.length + '</b> sản phẩm</span>' +
      '<span class="stat">Đang ẩn: <b>' + hiddenCount + '</b></span>' +
      (changed
        ? '<span class="stat warn">' + changed + ' thay đổi chưa lưu</span>'
        : '<span class="stat">Không có thay đổi chờ lưu</span>');
  }

  // ---- staged-state helpers ----
  function stagedPrice(src){
    if (hashOwn(dirty, src)) return dirty[src];
    if (hashOwn(overrides, src)) return overrides[src];
    var p = findProd(src);
    return p ? p.price : 0;
  }

  function stagedHidden(src){
    if (hashOwn(dirtyHidden, src)) return !!dirtyHidden[src];
    return hidden.indexOf(src) >= 0;
  }

  function stagedName(src){
    var p = findProd(src) || { vi: "", en: "" };
    var base = { vi: p.vi, en: p.en, renamed: false };
    if (hashOwn(dirtyNames, src)) return { vi: dirtyNames[src].vi || p.vi, en: dirtyNames[src].en || p.en, renamed: true };
    if (hashOwn(names, src)) return { vi: names[src].vi || p.vi, en: names[src].en || p.en, renamed: true };
    return base;
  }

// ---- Group layout (authoritative group membership + order + numbering) ----
  function defaultLayout(){
    var map = {};
    var order = [];
    products.forEach(function(p){
      if (!(p.group_num in map)){ map[p.group_num] = { num: p.group_num, title: p.group_title, srcs: [] }; order.push(p.group_num); }
      map[p.group_num].srcs.push(p.src);
    });
    return order.map(function(gn){
      var g = map[gn];
      // migrate legacy per-group reorder (orders) into the layout once.
      if (orders && orders[gn] && orders[gn].length){
        var bySrc = {};
        g.srcs.forEach(function(src){ bySrc[src] = 1; });
        var out = [];
        orders[gn].forEach(function(src){ if (bySrc[src]) out.push(src); });
        g.srcs.forEach(function(src){ if (out.indexOf(src) < 0) out.push(src); });
        g.srcs = out;
      }
      return { num: g.num, title: g.title, srcs: g.srcs.slice() };
    });
  }

  function normalizeLayout(l){
    if (!l || !l.length) return null;
    return l.map(function(g){ return { num: String(g.num || ""), title: g.title || "", srcs: (g.srcs || []).slice() }; });
  }

  // Renumber n groups sequentially as 2-digit strings.
  function renumberLayout(l){
    return l.map(function(g, i){
      return { num: String(i + 1).padStart(2, "0"), title: g.title, srcs: g.srcs.slice() };
    });
  }

  function layoutEq(a, b){
    if (!a && !b) return true;
    if (!a || !b) return false;
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++){
      if (a[i].title !== b[i].title) return false;
      if (renumberLayout([a[i]])[0].num !== b[i].num) return false;
      if (!arrayEq(a[i].srcs, b[i].srcs)) return false;
    }
    return true;
  }

  // Work on a mutable copy of the effective layout; renumber; mark staged dirty.
  function stageLayout(l){
    dirtyLayout = renumberLayout(normalizeLayout(l));
    layoutDirty = !layoutEq(normalizeLayout(dirtyLayout), effectiveLayout(false));
  }

  // effectiveLayout(skipDirty): if skipDirty, ignore staged layout (used for comparison).
  function effectiveLayout(skipDirty){
    if (!skipDirty && dirtyLayout) return normalizeLayout(dirtyLayout);
    if (groupLayout) return normalizeLayout(groupLayout);
    return defaultLayout();
  }

  function reorderGroupSrcs(gn, orderSrcs){
    var l = effectiveLayout();
    l.forEach(function(g){ if (g.num === gn) g.srcs = orderSrcs.slice(); });
    stageLayout(l);
    render();
    updateSaveAllState();
    showMsg(layoutDirty ? "Đã sắp xếp lại. Nhấn “Lưu tất cả thay đổi” để áp dụng." : "Đã trở về thứ tự ban đầu — không tính là thay đổi.");
  }

  function moveProduct(src, fromNum, toNum){
    var l = effectiveLayout();
    l.forEach(function(g){
      if (g.num === fromNum){ var i = g.srcs.indexOf(src); if (i >= 0) g.srcs.splice(i, 1); }
    });
    var target = null;
    l.forEach(function(g){ if (g.num === toNum) target = g; });
    if (!target) return;
    target.srcs.push(src);
    // Remove now-empty groups and renumber the rest sequentially.
    l = l.filter(function(g){ return g.srcs.length > 0; });
    stageLayout(l);
    render();
    updateSaveAllState();
    showMsg("Đã di chuyển sản phẩm sang nhóm " + toNum + ". Nhóm trống được bỏ và đánh số lại. Nhấn “Lưu tất cả thay đổi” để áp dụng.");
  }

  function deleteGroup(sh){
    var l = effectiveLayout();
    var idx = -1;
    l.forEach(function(g, i){ if (g.num === sh) idx = i; });
    if (idx < 0) return;
    var gone = l[idx];
    l.splice(idx, 1);
    // merge orphaned products into previous group (or next if first)
    if (gone.srcs.length && l.length){
      var idx2 = idx > 0 ? idx - 1 : 0;
      var merge = l[idx2];
      gone.srcs.forEach(function(src){
        if (merge.srcs.indexOf(src) < 0) merge.srcs.push(src);
      });
    }
    stageLayout(l);
    render();
    updateSaveAllState();
    showMsg("Đã xóa nhóm " + sh + " và đánh số lại (SP được gộp vào nhóm liền kề). Nhấn “Lưu tất cả thay đổi” để áp dụng.");
  }

  function hashOwn(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }
  function escHtml(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
  function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

  function bindEvents(){
    $("search").addEventListener("input", render);

    $("groups").addEventListener("change", function(e){
      if (e.target.classList.contains("group-move-select")){
        var src = e.target.getAttribute("data-move");
        var toNum = e.target.value;
        if (!toNum) return;
        var fromTr = e.target.closest("tr");
        var fromNum = fromTr ? fromTr.getAttribute("data-group") : null;
        if (!fromNum) return;
        moveProduct(src, fromNum, toNum);
        return;
      }
    });

    $("groups").addEventListener("click", function(e){
      var gh = e.target.closest(".group-head");
      if (gh && !e.target.closest("[data-group-rename]") && !e.target.closest(".group-edit-form") && !e.target.closest("[data-group-del]")){
        var blk = gh.closest(".group-block");
        var gn = blk ? blk.getAttribute("data-group-num") : null;
        if (!gn) return;
        blk.classList.toggle("collapsed");
        if (blk.classList.contains("collapsed")) collapsed[gn] = true;
        else delete collapsed[gn];
        try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }catch(err){}
        return;
      }
    });

    $("groups").addEventListener("input", function(e){
      if (e.target.classList.contains("price-input")){
        // Format nghìn với dấu chấm khi gõ, giữ caret ở cuối
        var raw = e.target.value;
        var digits = String(raw).replace(/[^\d]/g, "");
        var out = digits ? Number(digits).toLocaleString("vi-VN") : "";
        if (raw !== out){
          e.target.value = out;
          var pos = out.length;
          try { e.target.setSelectionRange(pos, pos); } catch(err){}
        }
        // Chỉ đánh dấu pending — KHÔNG stage, không render, không toast.
        var btn = e.target.closest("tr").querySelector("[data-save]");
        if (btn){
          btn.textContent = "Lưu";
          btn.classList.add("pending");
        }
        e.target.classList.add("changed");
      }
    });

    $("groups").addEventListener("click", function(e){
      var delbtn = e.target.closest("[data-group-del]");
      if (delbtn){
        var dgn = delbtn.getAttribute("data-group-del");
        var l = effectiveLayout();
        var dTitle = "";
        l.forEach(function(g){ if (g.num === dgn) dTitle = g.title; });
        var cnt = 0;
        l.forEach(function(g){ if (g.num === dgn) cnt = g.srcs.length; });
        if (!confirm("Xóa nhóm " + dgn + (dTitle ? " (" + dTitle + ")" : "") + " (" + cnt + " sản phẩm)?\n\nSản phẩm của nhóm sẽ được gộp vào nhóm liền kề, các nhóm còn lại sẽ được đánh số lại tự động.")) return;
        deleteGroup(dgn);
        return;
      }
      var btn = e.target.closest("[data-save]");
      if (btn){
        // Chỉ khi bấm "Lưu" thì sửa mới được tính là xong ở sản phẩm này.
        var src = btn.getAttribute("data-save");
        dirty[src] = Number(String(btn.closest("tr").querySelector('input[data-src="'+src+'"]').value).replace(/[^\d]/g, "")) || 0;
        pruneNoopStaged();
        render();
        updateSaveAllState();
        if (!hashOwn(dirty, src)){ showMsg("Giá trùng với mặc định — không tính là thay đổi."); return; }
        showMsg("Đã lưu tạm sản phẩm. Nhấn “Lưu tất cả thay đổi” ở trên để áp dụng.");
        return;
      }
      var hbtn = e.target.closest("[data-hide]");
      if (hbtn){
        var hsrc = hbtn.getAttribute("data-hide");
        var next = !stagedHidden(hsrc);
        dirtyHidden[hsrc] = next;
        pruneNoopStaged();
        render();
        updateSaveAllState();
        if (!hashOwn(dirtyHidden, hsrc)){ showMsg("Đã trở về trạng thái ban đầu — không tính là thay đổi."); return; }
        showMsg((next ? "Sẽ ẩn" : "Sẽ hiện") + " sản phẩm sau khi lưu tất cả.");
        return;
      }
      var rbtn = e.target.closest("[data-rename]");
      if (rbtn){
        openRename(rbtn);
        return;
      }
      var grbtn = e.target.closest("[data-group-rename]");
      if (grbtn){
        openGroupRename(grbtn);
        return;
      }
      var grbtn2 = e.target.closest("[data-group-rename-save]");
      if (grbtn2){
        stageGroupNameSave(grbtn2.closest("[data-group-edit-form]").getAttribute("data-group-edit-form"));
        return;
      }
      var grbtn3 = e.target.closest("[data-group-rename-cancel]");
      if (grbtn3){
        render();
        return;
      }
      var grbtn4 = e.target.closest("[data-group-rename-reset]");
      if (grbtn4){
        stageGroupNameReset(grbtn4.closest("[data-group-edit-form]").getAttribute("data-group-edit-form"));
      }
      var sbtn = e.target.closest("[data-rename-save]");
      if (sbtn){
        stageNameSave(sbtn.closest("[data-rename-form]").getAttribute("data-rename-form"));
        return;
      }
      var cbtn = e.target.closest("[data-rename-cancel]");
      if (cbtn){
        render();
        return;
      }
      var rbtn2 = e.target.closest("[data-rename-reset]");
      if (rbtn2){
        stageNameReset(rbtn2.closest("[data-rename-form]").getAttribute("data-rename-form"));
      }
    });

    $("saveAllBtn").addEventListener("click", openPublishModal);
    $("histBtn").addEventListener("click", openHistory);
    $("logoutBtn").addEventListener("click", function(){ localStorage.removeItem(PWD_KEY); location.reload(); });

    $("descCancel").addEventListener("click", closePublishModal);
    $("descOk").addEventListener("click", publishAll);
    $("histClose").addEventListener("click", function(){ $("histModal").classList.remove("open"); });
    $("histList").addEventListener("click", function(e){
      var rb = e.target.closest("[data-restore]");
      if (rb) restoreVersion(rb.getAttribute("data-restore"));
    });

    // Drag-and-drop reorder within a group
    var dragSrc = null;
    $("groups").addEventListener("dragstart", function(e){
      var tr = e.target.closest("tr[data-src]");
      if (!tr) return;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", tr.getAttribute("data-src"));
      dragSrc = tr.getAttribute("data-src");
      tr.classList.add("dragging");
    });
    $("groups").addEventListener("dragend", function(){
      dragSrc = null;
      var d = document.querySelectorAll("tr.dragging, tr.drag-over");
      for (var i = 0; i < d.length; i++) d[i].classList.remove("dragging", "drag-over");
    });
    $("groups").addEventListener("dragover", function(e){
      var tr = e.target.closest("tr[data-group]");
      if (!tr || !dragSrc) return;
      var from = document.querySelector('tr[data-src="' + dragSrc + '"]');
      if (!from || from.getAttribute("data-group") !== tr.getAttribute("data-group")) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var overClass = document.querySelectorAll("tr.drag-over");
      for (var i = 0; i < overClass.length; i++) overClass[i].classList.remove("drag-over");
      tr.classList.add("drag-over");
    });
    $("groups").addEventListener("drop", function(e){
      e.preventDefault();
      var tr = e.target.closest("tr[data-group]");
      if (!tr || !dragSrc) return;
      var from = document.querySelector('tr[data-src="' + dragSrc + '"]');
      if (!from || from === tr || from.getAttribute("data-group") !== tr.getAttribute("data-group")) return;
      var gn = from.getAttribute("data-group");
      var tbody = tr.parentNode;
      var rows = Array.prototype.slice.call(tbody.querySelectorAll("tr[data-src]"));
      var fromIdx = rows.indexOf(from);
      var toIdx = rows.indexOf(tr);
      rows.splice(fromIdx, 1);
      rows.splice(toIdx, 0, from);
      rows.forEach(function(r){ tbody.appendChild(r); });
      // capture the new order (full group, unsorted) into staged layout srcs
      var orderSrcs = rows.map(function(r){ return r.getAttribute("data-src"); });
      reorderGroupSrcs(gn, orderSrcs);
    });

    // ---- Cover (PDF) panel events ----
    $("coverHead").addEventListener("click", function(){
      var panel = $("coverPanel");
      panel.classList.toggle("collapsed");
    });
    $("coverGrid").addEventListener("click", function(e){
      var b = e.target.closest("[data-cover-toggle]");
      if (!b) return;
      toggleCover(b.getAttribute("data-cover-toggle"));
    });
    $("coverOrdered").addEventListener("click", function(e){
      var up = e.target.closest("[data-cover-up]");
      if (up){ moveCover(up.getAttribute("data-cover-up"), -1); return; }
      var down = e.target.closest("[data-cover-down]");
      if (down){ moveCover(down.getAttribute("data-cover-down"), 1); return; }
      var b = e.target.closest("[data-cover-toggle]");
      if (b){ toggleCover(b.getAttribute("data-cover-toggle")); return; }
    });
    var coverSearchTimer = null;
    $("coverSearch").addEventListener("input", function(){
      clearTimeout(coverSearchTimer);
      var q = this.value;
      coverSearchTimer = setTimeout(function(){ renderCover(); }, 150);
    });
  }

  function arrayEq(a, b){
    if (a === b) return true;
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function savedPrice(src){
    return hashOwn(overrides, src) ? overrides[src] : (findProd(src) ? findProd(src).price : 0);
  }

  function savedHidden(src){
    return hidden.indexOf(src) >= 0;
  }

  function pruneNoopStaged(){
    var changedAny = false;
    Object.keys(dirty).forEach(function(src){
      if (dirty[src] === savedPrice(src)){ delete dirty[src]; changedAny = true; }
    });
    Object.keys(dirtyHidden).forEach(function(src){
      if (!!dirtyHidden[src] === savedHidden(src)){ delete dirtyHidden[src]; changedAny = true; }
    });
    Object.keys(dirtyNames).forEach(function(src){
      var p = findProd(src);
      var saved = hashOwn(names, src) ? names[src] : (p ? { vi: p.vi, en: p.en } : null);
      if (!saved) return;
      var dv = dirtyNames[src].vi || "";
      var dev = dirtyNames[src].en || "";
      if (dv === (saved.vi || "") && dev === (saved.en || "")){ delete dirtyNames[src]; changedAny = true; }
    });
    if (dirtyLayout && layoutEq(dirtyLayout, savedLayoutValue())){
      dirtyLayout = null;
      layoutDirty = false;
      changedAny = true;
    }
    if (dirtyCover && arraysEqual(dirtyCover, savedCover())){
      dirtyCover = null;
      coverDirty = false;
      changedAny = true;
    }
    layoutDirty = dirtyLayout !== null;
    coverDirty = dirtyCover !== null;
    return changedAny;
  }

  // Layout value for equality comparison: saved layout if set, else the default.
  function savedLayoutValue(){
    if (groupLayout) return normalizeLayout(groupLayout);
    return defaultLayout();
  }

  function updateSaveAllState(){
    pruneNoopStaged();
    var n = Object.keys(dirty).length + Object.keys(dirtyHidden).length + Object.keys(dirtyNames).length + (layoutDirty ? 1 : 0) + (coverDirty ? 1 : 0);
    var btn = $("saveAllBtn");
    if (btn){
      btn.disabled = n === 0;
      btn.textContent = n ? "Lưu tất cả thay đổi (" + n + ")" : "Lưu tất cả thay đổi";
      btn.classList.toggle("has-pending", n > 0);
    }
    updateSummary();
  }

  function authHeaders(){
    var h = { "Content-Type": "application/json" };
    var pwd = localStorage.getItem(PWD_KEY) || "";
    if (pwd) h["x-admin-password"] = pwd;
    return h;
  }

  function findProd(src){
    for (var i=0;i<products.length;i++){ if (products[i].src === src) return products[i]; }
    return null;
  }

  function openRename(btn){
    var src = btn.getAttribute("data-rename");
    var p = findProd(src);
    if (!p) return;
    var cur = stagedName(src);
    var cell = btn.closest("td");
    var form = document.createElement("div");
    form.className = "rename-form";
    form.setAttribute("data-rename-form", src);
    form.innerHTML =
      '<input class="rename-vi" value="' + escAttr(cur.vi) + '" placeholder="Tên tiếng Việt">' +
      '<input class="rename-en" value="' + escAttr(cur.en) + '" placeholder="Tên tiếng Anh">' +
      '<div class="rename-row">' +
        '<button type="button" class="rename-save" data-rename-save="1">Lưu tên</button>' +
        '<button type="button" class="rename-cancel" data-rename-cancel="1">Hủy</button>' +
        '<button type="button" class="rename-cancel" data-rename-reset="1" title="Khôi phục tên mặc định">Khôi phục</button>' +
      '</div>';
    cell.appendChild(form);
    btn.style.display = "none";
  }

  function stageNameSave(src){
    var form = document.querySelector('[data-rename-form="' + src + '"]');
    if (!form) return;
    var vi = form.querySelector(".rename-vi").value.trim();
    var en = form.querySelector(".rename-en").value.trim();
    if (!vi && !en){ render(); return; }
    dirtyNames[src] = { vi: vi, en: en };
    pruneNoopStaged();
    render();
    updateSaveAllState();
    showMsg(hashOwn(dirtyNames, src) ? "Đã lưu tạm tên sản phẩm. Nhấn “Lưu tất cả thay đổi” để áp dụng." : "Tên trùng với tên hiện tại — không tính là thay đổi.");
  }

  function stageNameReset(src){
    var p = findProd(src);
    if (!p) return;
    dirtyNames[src] = { vi: p.vi, en: p.en };
    pruneNoopStaged();
    render();
    updateSaveAllState();
    showMsg(hashOwn(dirtyNames, src) ? "Đã khôi phục tên mặc định (sẽ áp dụng khi lưu tất cả)." : "Tên đã là mặc định — không tính là thay đổi.");
  }

  function openGroupRename(btn){
    var gn = btn.getAttribute("data-group-rename");
    var cur = "";
    effectiveLayout().forEach(function(g){ if (g.num === gn) cur = g.title; });
    var head = btn.closest(".group-head");
    var titleSpan = head.querySelector(".group-title");
    var form = document.createElement("span");
    form.className = "group-edit-form";
    form.setAttribute("data-group-edit-form", gn);
    form.innerHTML =
      '<input class="grp-name-input" value="' + escAttr(cur) + '" placeholder="Tên nhóm">' +
      '<button type="button" class="rename-save" data-group-rename-save="1">Lưu tên</button>' +
      '<button type="button" class="rename-cancel" data-group-rename-cancel="1">Hủy</button>' +
      '<button type="button" class="rename-cancel" data-group-rename-reset="1" title="Khôi phục tên gốc">Khôi phục</button>';
    head.insertBefore(form, btn);
    titleSpan.style.display = "none";
    btn.style.display = "none";
    form.querySelector(".grp-name-input").focus();
  }

  function renameGroup(gn, t){
    var l = effectiveLayout();
    l.forEach(function(g){ if (g.num === gn) g.title = t; });
    stageLayout(l);
    render();
    updateSaveAllState();
    showMsg(layoutDirty ? "Đã lưu tạm tên nhóm. Nhấn “Lưu tất cả thay đổi” để áp dụng." : "Tên trùng với tên hiện tại — không tính là thay đổi.");
  }

  function stageGroupNameSave(gn){
    var form = document.querySelector('[data-group-edit-form="' + gn + '"]');
    if (!form) return;
    var t = form.querySelector(".grp-name-input").value.trim();
    if (!t){ render(); return; }
    renameGroup(gn, t);
  }

  function stageGroupNameReset(gn){
    var t = defaultLayout().filter(function(g){ return g.num === gn; });
    var res = t.length ? t[0].title : "";
    renameGroup(gn, res);
  }

  // ---- Publish all staged changes ----
  function openPublishModal(){
    var n = Object.keys(dirty).length + Object.keys(dirtyHidden).length + Object.keys(dirtyNames).length + (layoutDirty ? 1 : 0) + (coverDirty ? 1 : 0);
    if (!n){ showMsg("Không có thay đổi nào để lưu."); return; }
    $("descSummary").textContent = n + " thay đổi đang chờ được lưu.";
    $("descInput").value = "";
    $("descModal").classList.add("open");
    setTimeout(function(){ $("descInput").focus(); }, 50);
  }

  function closePublishModal(){ $("descModal").classList.remove("open"); }

  function publishAll(){
    var desc = $("descInput").value.trim();
    if (!desc){ $("descInput").style.borderColor = "#e74c3c"; return; }
    $("descInput").style.borderColor = "";
    var next = computeMergedState();
    $("descOk").disabled = true;
    fetch("/api/publish", { method: "PUT", headers: authHeaders(), body: JSON.stringify({ desc: desc, overrides: next.overrides, hidden: next.hidden, names: next.names, group_layout: next.group_layout, cover: next.cover }) })
      .then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
      .then(function(t){
        if (!t.r.ok){ throw new Error(t.d.error || "Lỗi"); }
        overrides = t.d.overrides || {};
        hidden = t.d.hidden || [];
        names = t.d.names || {};
        groupLayout = t.d.group_layout || null;
        cover = t.d.cover || null;
        versions = t.d.versions || [];
        dirty = {}; dirtyHidden = {}; dirtyNames = {}; dirtyLayout = null; layoutDirty = false; dirtyCover = null; coverDirty = false;
        closePublishModal();
        render();
        updateSaveAllState();
        showMsg("Đã lưu tất cả thay đổi.");
      })
      .catch(function(err){
        showMsg("Lỗi: " + err.message);
        if (err.message.indexOf("401") >= 0 || err.message.indexOf("Sai mật khẩu") >= 0){ logoutLocal(); }
      })
      .finally(function(){ runInline(null, function(){ $("descOk").disabled = false; }); });
  }

  function computeMergedState(){
    // prices: staged dirty overrides saved
    var ov = Object.keys(overrides).reduce(function(o, src){ o[src] = overrides[src]; return o; }, {});
    Object.keys(dirty).forEach(function(src){
      if (dirty[src] > 0) ov[src] = dirty[src];
      else delete ov[src];
    });
    // hidden
    var hidSet = hidden.slice();
    Object.keys(dirtyHidden).forEach(function(src){
      var idx = hidSet.indexOf(src);
      if (dirtyHidden[src]){ if (idx < 0) hidSet.push(src); }
      else if (idx >= 0) hidSet.splice(idx, 1);
    });
    // names: staged dirtyNames overrides saved
    var nm = Object.keys(names).reduce(function(o, src){ o[src] = { vi: names[src].vi, en: names[src].en }; return o; }, {});
    Object.keys(dirtyNames).forEach(function(src){
      var p = findProd(src);
      if (!dirtyNames[src].vi && !dirtyNames[src].en && !(p && p.vi === dirtyNames[src].vi)) {
        delete nm[src];
      } else if (dirtyNames[src].vi || dirtyNames[src].en) {
        nm[src] = { vi: dirtyNames[src].vi, en: dirtyNames[src].en };
      }
    });
    // layout: staged dirty overrides saved (renumbered, authoritative)
    var gl = dirtyLayout ? normalizeLayout(dirtyLayout) : savedLayoutValue();
    // cover: staged if set, else saved
    var cv = dirtyCover ? dirtyCover.slice() : savedCover();
    return { overrides: ov, hidden: hidSet, names: nm, group_layout: gl, cover: cv };
  }

  // ---- History ----
  function openHistory(){
    fetch("/api/history", { headers: authHeaders() })
      .then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
      .then(function(t){
        if (!t.r.ok){ throw new Error(t.d.error || "Lỗi"); }
        versions = t.d.versions || [];
        renderHistory();
        $("histModal").classList.add("open");
      })
      .catch(function(err){
        showMsg("Lỗi: " + err.message);
        if (err.message.indexOf("401") >= 0 || err.message.indexOf("Sai mật khẩu") >= 0){ logoutLocal(); }
      });
  }

  function renderHistory(){
    var box = $("histList");
    box.innerHTML = "";
    if (!versions.length){
      box.innerHTML = '<div class="hist-empty">Chưa có lịch sử thay đổi.</div>';
      return;
    }
    versions.forEach(function(v){
      var item = document.createElement("div");
      item.className = "hist-item";
      var t = new Date(v.at).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
      item.innerHTML =
        '<div class="h-time">' + escHtml(t) + '</div>' +
        '<div class="h-desc">' + escHtml(v.desc || "") + '</div>' +
        '<button class="hist-restore" data-restore="' + escAttr(v.id) + '">Khôi phục</button>';
      box.appendChild(item);
    });
  }

  function restoreVersion(id){
    var v = null;
    for (var i=0;i<versions.length;i++){ if (versions[i].id === id){ v = versions[i]; break; } }
    if (!v) return;
    var t = new Date(v.at).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    if (!confirm("Khôi phục trạng thái từ phiên bản lúc " + t + "?\n\nHiện tại: " + (v.desc || "(không mô tả)") + "\n\nCác thay đổi chưa lưu sẽ bị mất.")) return;
    fetch("/api/restore", { method: "POST", headers: authHeaders(), body: JSON.stringify({ id: id }) })
      .then(function(r){ return r.json().then(function(d){ return {r:r, d:d}; }); })
      .then(function(t2){
        if (!t2.r.ok){ throw new Error(t2.d.error || "Lỗi"); }
        overrides = t2.d.overrides || {};
        hidden = t2.d.hidden || [];
        names = t2.d.names || {};
        groupLayout = t2.d.group_layout || null;
        cover = t2.d.cover || null;
        versions = t2.d.versions || [];
        dirty = {}; dirtyHidden = {}; dirtyNames = {}; dirtyLayout = null; layoutDirty = false; dirtyCover = null; coverDirty = false;
        $("histModal").classList.remove("open");
        render();
        updateSaveAllState();
        showMsg("Đã khôi phục phiên bản cũ.");
      })
      .catch(function(err){
        showMsg("Lỗi: " + err.message);
        if (err.message.indexOf("401") >= 0 || err.message.indexOf("Sai mật khẩu") >= 0){ logoutLocal(); }
      });
  }

  function logoutLocal(){ localStorage.removeItem(PWD_KEY); location.reload(); }

  function runInline(btn, fn){ try{ fn(); }catch(e){} }

  function bootstrap(){
    // Load product catalog
    fetch("/products.json")
      .then(function(r){ return r.json(); })
      .then(function(list){
        products = list;
        return fetch("/api/prices", { headers: authHeaders() });
      })
      .then(function(r){ return r.json(); })
      .then(function(d){ overrides = d.overrides || {}; hidden = d.hidden || []; names = d.names || {}; orders = d.orders || {}; groupLayout = d.group_layout || null; cover = d.cover || null; versions = d.versions || []; })
      .then(render)
      .then(updateSummary)
      .catch(function(err){ showMsg("Không tải được dữ liệu: " + err.message); });
  }

  // ---- Login flow ----
  var saved = localStorage.getItem(PWD_KEY);
  if (saved){
    $("app").style.display = "block";
    $("loginScreen").style.display = "none";
    bindEvents();
    bootstrap();
  } else {
    $("loginBtn").addEventListener("click", tryLogin);
    $("pwd").addEventListener("keydown", function(e){ if (e.key === "Enter") tryLogin(); });
  }

  function tryLogin(){
    var pwd = $("pwd").value;
    fetch("/api/auth/verify", { headers: { "x-admin-password": pwd } })
      .then(function(r){
        if (r.status === 401) throw new Error("pwd");
        return r.json();
      })
      .then(function(){
        localStorage.setItem(PWD_KEY, pwd);
        $("app").style.display = "block";
        $("loginScreen").style.display = "none";
        bindEvents();
        bootstrap();
      })
      .catch(function(){ $("loginErr").textContent = "Sai mật khẩu."; });
  }
})();
</script>
<script>
  (function(){
    var y = String(new Date().getFullYear());
    if (y === "2026") return;
    function sub(s){ return s.split("2026").join(y); }
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (var i = 0; i < nodes.length; i++){
      if (nodes[i].nodeValue.indexOf("2026") >= 0) nodes[i].nodeValue = sub(nodes[i].nodeValue);
    }
    var metas = document.querySelectorAll("meta[content*='2026']");
    for (var k = 0; k < metas.length; k++) metas[k].content = sub(metas[k].content);
    if (document.title.indexOf("2026") >= 0) document.title = sub(document.title);
  })();
</script>
